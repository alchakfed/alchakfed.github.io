name: Daily Scrape

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install

      - name: Run scraper
        run: node scraper.js
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}

      - name: Send towns payload to Render bot host
        env:
          RENDER_SYNC_URL: ${{ secrets.RENDER_SYNC_URL }}
          SYNC_SHARED_SECRET: ${{ secrets.SYNC_SHARED_SECRET }}
        run: |
          if [ -z "$RENDER_SYNC_URL" ] || [ -z "$SYNC_SHARED_SECRET" ]; then
            echo "Missing RENDER_SYNC_URL or SYNC_SHARED_SECRET."
            exit 1
          fi
          SYNC_URL="${RENDER_SYNC_URL%/}"
          if ! echo "$SYNC_URL" | grep -q "/api/towns-sync$"; then
            SYNC_URL="$SYNC_URL/api/towns-sync"
          fi
          echo "Sending towns payload to $SYNC_URL"
          curl --fail --show-error --silent \
            -X POST \
            -H "Content-Type: application/json" \
            -H "x-sync-secret: $SYNC_SHARED_SECRET" \
            --data-binary @towns.json \
            "$SYNC_URL"

      - name: Commit updated data files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add towns.json
          # Only commit if changes exist
          git diff --staged --quiet || git commit -m "Update towns.json (automated)"
          git push


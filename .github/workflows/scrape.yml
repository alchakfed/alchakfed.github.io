name: Daily Scrape

on:
  schedule:
    - cron: '30 19 * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: daily-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run scheduled scrape
        run: npm run cron
        env:
          CONFIG_JSON: ${{ secrets.CONFIG_JSON }}

      - name: Commit updated towns.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add towns.json
          if git diff --staged --quiet; then
            echo "No towns.json changes to commit."
            exit 0
          fi
          git commit -m "Update towns.json (automated)"
          git push

